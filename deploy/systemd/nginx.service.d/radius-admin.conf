# radius-admin drop-in for the distribution's nginx.service, installed by the nginx phase
# as /etc/systemd/system/nginx.service.d/radius-admin.conf.
#
# The portal's site uses ssl_ocsp_responder, and nginx resolves that host name when it
# loads its configuration: a failed lookup is fatal ("host not found in OCSP responder"),
# so nginx does not start. If that happens while DNS is briefly unavailable (at boot, or
# when unattended-upgrades restarts nginx), the stock unit does not try again and the
# portal stays down until someone starts nginx by hand.
#   - start only after the network is up and name lookups are possible;
#   - on failure, retry every 30 seconds without a start limit (StartLimitIntervalSec=0),
#     so nginx comes back by itself once DNS answers again.
[Unit]
After=network-online.target nss-lookup.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30s
