# radius-admin -- nginx site (nginx 1.24, Ubuntu 24.04). SPEC sections 7 and 9.
#
# TEMPLATE: install.sh renders the @...@ placeholders and installs the result as
# /etc/nginx/sites-available/radius-admin (+ symlink in sites-enabled):
#   @LISTEN_IP@    this server's management address (e.g. 192.0.2.10)
#   @SERVER_NAME@  radius.example.net
#   @ADMIN_NET@    192.0.2.0/24
#   @RESOLVER@     DNS server(s) for OCSP lookups (from resolvectl / resolv.conf)
#   @OCSP_URL@     http://pki.example.net:8080/ocsp
#
# There is deliberately NO port-80 listener. Access is limited to the admin subnet here
# AND in the host firewall (deploy/firewall/*).
#
# This file is included inside the http{} block (sites-enabled/*), so zones live here.

limit_req_zone $binary_remote_addr zone=radius_admin_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=radius_admin_all:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=radius_admin_conn:1m;

upstream radius_admin_app {
    server unix:/run/radius-admin/app.sock;
    keepalive 4;
}

server {
    listen @LISTEN_IP@:443 ssl http2 default_server;
    server_name @SERVER_NAME@;

    # ---- network ACL (defence in depth; the host firewall enforces the same) ----
    allow @ADMIN_NET@;
    deny  all;

    # Only the canonical host name (CSRF Origin checks compare against Host).
    if ($host != "@SERVER_NAME@") {
        return 421;
    }

    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn radius_admin_conn 30;
    limit_req zone=radius_admin_all burst=60 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/radius-admin.access.log;
    error_log  /var/log/nginx/radius-admin.error.log warn;

    # ---- server TLS (FIPS-approved algorithms only; SPEC section 7) ----
    ssl_certificate     /etc/radius-admin/tls/server.crt;   # leaf + intermediate(s)
    ssl_certificate_key /etc/radius-admin/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_ecdh_curve secp384r1:prime256v1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:radius_admin_tls:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ---- client certificates (optional; used as an MFA factor by the app) ----
    ssl_verify_client optional;
    ssl_client_certificate /etc/radius-admin/tls/client-ca.pem;  # Example-IssuingCA + Example-RootCA
    ssl_verify_depth 3;
    # Revocation of client certs via the internal PKI's OCSP responder (leaf only: the
    # responder is not assumed to answer for Example-IssuingCA itself; `ssl_ocsp on` would
    # check every certificate in the chain). Fail-closed: a revoked OR unverifiable
    # (responder unreachable) presented certificate makes nginx answer 400 for that
    # TLS connection. Users can still sign in with TOTP from a browser that does not
    # present a certificate. See RUNBOOK "Troubleshooting".
    ssl_ocsp leaf;
    ssl_ocsp_responder @OCSP_URL@;
    ssl_ocsp_cache shared:radius_admin_ocsp:1m;
    resolver @RESOLVER@ valid=300s ipv6=off;
    resolver_timeout 5s;

    # ---- security headers (also set by the app) ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin, NOT no-referrer: with no-referrer browsers send "Origin: null" on
    # same-origin form POSTs, which the app's CSRF origin check must refuse.
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ---- proxy to gunicorn. Every header below OVERWRITES anything the client sent. ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Client-Verify $ssl_client_verify;
    proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    proxy_pass_request_headers on;
    proxy_redirect off;
    proxy_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # apply/rollback wait for the root helper (<= ~120 s)
    proxy_read_timeout 180s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    location = /login {
        limit_req zone=radius_admin_login burst=10 nodelay;
        proxy_pass http://radius_admin_app;
    }

    location = /login/mfa {
        limit_req zone=radius_admin_login burst=10 nodelay;
        proxy_pass http://radius_admin_app;
    }

    location / {
        proxy_pass http://radius_admin_app;
    }
}
