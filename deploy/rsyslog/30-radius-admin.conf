# /etc/rsyslog.d/30-radius-admin.conf (installed by deploy/install.sh)
# radius-admin (web app, ident "radius-admin") and the root helper
# (ident "radius-admin-helper") log to facility authpriv. Keep a dedicated file
# (also still goes to /var/log/auth.log via the default authpriv rule).
if ($syslogfacility-text == "authpriv") and ($programname == "radius-admin" or $programname == "radius-admin-helper") then {
    action(type="omfile" file="/var/log/radius-admin/audit.log" fileOwner="root" fileGroup="adm" fileCreateMode="0640" dirCreateMode="0750")
}
