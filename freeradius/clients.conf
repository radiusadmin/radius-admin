#
#  radius-admin: RADIUS clients other than localhost are generated from the web UI
#  into radius-admin-clients.conf (imported from the former wifi-aps block and
#  switches.conf by deploy/migrate_sqlite_to_pg.py).
#  DEPLOYMENT NOTE: "secret = REDACTED" below is a placeholder from the redacted
#  inventory. Keep the existing localhost secret from the live clients.conf.
#
$INCLUDE radius-admin-clients.conf
client localhost {
    ipaddr = 127.0.0.1
    secret = REDACTED
    require_message_authenticator = auto
}
