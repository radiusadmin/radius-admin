name: Pages

# Publishes the project site (site/, plain static files) to GitHub Pages on pushes to main
# that touch it. The only processing is stamping the released version from VERSION into the
# page, so the site never carries a hand-edited number.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is not X.Y.Z: '$ver'"; exit 1
          fi
          sed -i -E "s|(<span class=\"ver\">)[^<]*(</span>)|\1${ver}\2|g" site/index.html
          n=$(grep -o "<span class=\"ver\">${ver}</span>" site/index.html | wc -l)
          echo "Stamped version ${ver} in ${n} places"
          [ "$n" -ge 1 ]
      - name: Check that the page loads nothing from another origin
        run: |
          if grep -nE '(src|srcset)="(https?:)?//|<link[^>]+href="(https?:)?//|url\((https?:)?//|@import' site/*.html site/*.css; then
            echo "::error::The site must not load resources from other origins"; exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
