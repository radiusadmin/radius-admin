name: Release

# A signed build for the update channel of each branch (SPEC section 16): build the bundle
# (portal + FreeRADIUS package), sign its manifest with the ECDSA P-384 key in the
# UPDATE_SIGNING_KEY secret and publish it as a GitHub release. main and testing publish after
# CI passes on a push (main only when VERSION changes); dev publishes only when started by
# hand (Actions -> Release -> Run workflow on dev), for a commit whose CI passed. testing and
# dev keep their newest 3 builds. Only the build job runs in the `release` environment, and
# only when the version check finds a new version, so a reviewer is asked only for a real build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Decides whether there is anything to publish, outside the release environment, so a push
  # that publishes nothing (a main merge without a VERSION change) never waits for a reviewer.
  check:
    name: Version check
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      CHANNEL: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      prev: ${{ steps.v.outputs.prev }}
      publish: ${{ steps.v.outputs.exists != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: CI passed for this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" \
              --jq .total_count)
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error title=No build published::CI has not passed for $SHA on a push to $CHANNEL; wait for it or fix it, then run this again."
            exit 1
          fi
      - name: Version
        id: v
        # version and prev become job outputs that the signing job uses; they are checked here
        # against exact patterns (tag names are chosen by whoever pushes a tag), and the signing
        # job reads them only through env, never as ${{ }} inside a script.
        run: |
          case $CHANNEL in
            main|testing|dev) ;;
            *) echo "::error::no release channel for this branch"; exit 1 ;;
          esac
          ver=$(tools/release/build-version.sh "$CHANNEL" HEAD)
          if ! [[ $ver =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(rc|dev)\.[0-9]{1,6})?$ ]]; then
            echo "::error::build-version.sh printed an invalid version"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$CHANNEL" = main ]; then
              # main takes its version from VERSION alone: without a bump nothing new is published.
              msg="v$ver is already released, so this push to main publishes nothing. Bump VERSION on dev after each release (RUNBOOK, Releasing)."
              echo "::warning title=No release published::$msg"
              echo "### No release published" >> "$GITHUB_STEP_SUMMARY"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::v$ver is already released"
            fi
          elif [ "$CHANNEL" = main ] && ! grep -Eq "^## $(printf %s "$ver" | sed 's/\./\\./g')( |$)" CHANGELOG.md; then
            echo "::warning title=Empty release notes::CHANGELOG.md has no \"## $ver\" section, so v$ver is published without notes. Rename \"## Unreleased\" to \"## $ver — <date>\" before merging to main."
          fi
          # only exact release tags of this channel (prev-tag.sh skips any other tag name)
          prev=$(tools/release/prev-tag.sh "$CHANNEL" "$ver")
          if [ -n "$prev" ] && ! [[ $prev =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(rc|dev)\.[0-9]{1,6})?$ ]]; then
            echo "::error::prev-tag.sh printed an invalid tag"; exit 1
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Building $ver for $CHANNEL (previous: ${prev:-none})"

  release:
    name: Signed build
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      # outputs of the check job: used in scripts only as "$VERSION" / "$PREV"
      VERSION: ${{ needs.check.outputs.version }}
      PREV: ${{ needs.check.outputs.prev }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Release names valid
        run: |
          re='^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(rc|dev)\.[0-9]{1,6})?$'
          case $CHANNEL in main|testing|dev) ;; *) echo "::error::invalid channel"; exit 1 ;; esac
          [[ $VERSION =~ $re ]] || { echo "::error::invalid version from the check job"; exit 1; }
          [[ -z $PREV || ${PREV#v} =~ $re && $PREV == v* ]] \
            || { echo "::error::invalid previous tag from the check job"; exit 1; }
      - name: Signing key present
        id: key
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ] || [ ! -s deploy/keys/update-signing.pem ]; then
            echo "::warning::No release published: set the UPDATE_SIGNING_KEY secret and commit deploy/keys/update-signing.pem (RUNBOOK section 9.3)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build radius-admin-freeradius
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential pkg-config dpkg-dev \
              binutils libtalloc-dev libssl-dev libpq-dev libldap-dev curl gnupg ca-certificates file python3-apt
          sudo tools/ci/distro-libpq.sh
          sudo tools/package/build-freeradius-deb.sh "$GITHUB_WORKSPACE/packages" /var/tmp/ra-frpkg
          sudo chown -R "$(id -u):$(id -g)" packages
      - name: Build and sign the release
        if: steps.key.outputs.ok == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: tools/release/make-release.sh "$CHANNEL" "$RUNNER_TEMP/release" "$PREV"
      - name: Publish
        if: steps.key.outputs.ok == 'true'
        run: |
          v=$VERSION
          OUT=$RUNNER_TEMP/release
          flags=(--latest)
          if [ "$CHANNEL" != main ]; then flags=(--prerelease --latest=false); fi
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "radius-admin $v" --notes-file "$OUT/notes.md" "${flags[@]}" \
              "$OUT/radius-admin-$v.tar.gz" "$OUT/manifest.json" "$OUT/manifest.json.sig"
      - name: Keep the newest 3 builds of this channel
        if: steps.key.outputs.ok == 'true' && env.CHANNEL != 'main'
        run: |
          suffix=$([ "$CHANNEL" = testing ] && echo rc || echo dev)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -- "-$suffix\." | sort -V -r | tail -n +4 \
            | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y; done
