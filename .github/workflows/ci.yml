name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  REPO: /srv/radius-admin
  LOGS: /var/tmp/ci-logs

defaults:
  run:
    # explicit bash = -eo pipefail, so a suite piped into tee still fails its step
    shell: bash

jobs:
  lint:
    name: Shellcheck and site-data scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning deploy/*.sh tests/freeradius/*.sh tests/migration/*.sh \
              tests/installer/*.sh tests/package/*.sh tests/release/*.sh tests/ci/*.sh tools/*.sh tools/ci/*.sh \
              tools/lib/*.sh tools/package/*.sh tools/release/*.sh integrations/*/*.sh
      - name: Site-data scan
        env:
          SITE_TERMS_CONTENT: ${{ secrets.SITE_TERMS }}
        run: |
          if [ -z "$SITE_TERMS_CONTENT" ]; then
            echo "::warning::Repository secret SITE_TERMS is not set: only the generic checks run."
          else
            printf '%s\n' "$SITE_TERMS_CONTENT" > "$RUNNER_TEMP/site-terms.txt"
            export SITE_TERMS="$RUNNER_TEMP/site-terms.txt"
          fi
          # Print where a hit is (file:line), never the matching text, so the private
          # terms cannot end up in the log.
          set +e
          tools/site-scan.sh > "$RUNNER_TEMP/scan.out" 2>&1
          rc=$?
          awk -F: '/^== / || /^site-data scan/ || /^warning/ { print; next } { print $1 ":" $2 }' "$RUNNER_TEMP/scan.out" \
            | sed "s#$GITHUB_WORKSPACE/##"
          rm -f "$RUNNER_TEMP/site-terms.txt"
          exit $rc

  unit:
    name: Root helper and installer tests
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare sandbox
        run: |
          sudo mkdir -p "$REPO" && sudo cp -a "$GITHUB_WORKSPACE/." "$REPO/"
          sudo "$REPO/tools/ci/setup.sh" "$REPO"
      - name: Root helper tests
        run: |
          mkdir -p "$LOGS"
          cd "$REPO" && sudo -E python3 -m pytest -q -p no:cacheprovider tests/helper | tee "$LOGS/helper.log"
      - name: Licence tool tests
        run: cd "$REPO" && sudo -E python3 -m pytest -q -p no:cacheprovider tests/licence | tee "$LOGS/licence-tool.log"
      - name: Installer answers tests
        run: cd "$REPO" && sudo bash tests/installer/test_answers.sh | tee "$LOGS/installer.log"
      - name: Installer live settings
        run: cd "$REPO" && sudo bash tests/installer/test_live_settings.sh | tee "$LOGS/live-settings.log"
      - name: LDAP settings kept on upgrade
        run: cd "$REPO" && bash tests/installer/test_ldap_carry_over.sh | tee "$LOGS/ldap-carry-over.log"
      - name: EAP certificate and OCSP settings kept on upgrade
        run: cd "$REPO" && bash tests/installer/test_eap_carry_over.sh | tee "$LOGS/eap-carry-over.log"
      - name: Domain join script
        run: cd "$REPO" && bash tests/installer/test_ad_join.sh | tee "$LOGS/ad-join.log"
      - name: Update install checks
        run: cd "$REPO" && sudo bash tests/installer/test_update_install.sh | tee "$LOGS/update-install.log"
      - name: Update keeps client secrets readable (rollback)
        run: cd "$REPO" && sudo bash tests/installer/test_update_secrets.sh | tee "$LOGS/update-secrets.log"
      - name: Integration install checks
        run: cd "$REPO" && sudo bash tests/installer/test_integration_install.sh | tee "$LOGS/integration-install.log"
      - name: Duo install checks
        run: cd "$REPO" && sudo bash tests/installer/test_duo_install.sh | tee "$LOGS/duo-install.log"
      - name: nginx.service drop-in
        run: cd "$REPO" && bash tests/installer/test_nginx_dropin.sh | tee "$LOGS/nginx-dropin.log"
      - name: nginx security floor
        run: cd "$REPO" && bash tests/installer/test_nginx_update.sh | tee "$LOGS/nginx-update.log"
      - name: FreeRADIUS max_request_time
        run: cd "$REPO" && bash tests/installer/test_max_request_time.sh | tee "$LOGS/max-request-time.log"
      - name: Installer re-runs
        run: cd "$REPO" && sudo bash tests/installer/test_install_reruns.sh | tee "$LOGS/install-reruns.log"
      - name: Release tooling tests
        run: cd "$REPO" && sudo bash tests/release/test_release.sh | tee "$LOGS/release.log"
      - name: Install from a checkout (signed release download)
        run: cd "$REPO" && sudo bash tests/installer/test_fetch_release.sh | tee "$LOGS/fetch-release.log"
      - name: CI skips for tested trees
        run: cd "$REPO" && bash tests/ci/test_tested_tree.sh | tee "$LOGS/tested-tree.log"
      - name: Count tests
        id: counts
        if: always()
        run: |
          tools/ci/test-counts.py "$LOGS/helper.log" "$LOGS/licence-tool.log" "$LOGS/installer.log" "$LOGS/live-settings.log" "$LOGS/ad-join.log" \
              "$LOGS/ldap-carry-over.log" "$LOGS/eap-carry-over.log" "$LOGS/update-install.log" "$LOGS/update-secrets.log" "$LOGS/integration-install.log" "$LOGS/duo-install.log" "$LOGS/nginx-dropin.log" "$LOGS/nginx-update.log" "$LOGS/max-request-time.log" "$LOGS/install-reruns.log" "$LOGS/release.log" "$LOGS/fetch-release.log" "$LOGS/tested-tree.log" | tee -a "$GITHUB_OUTPUT"

  # The package and bench jobs take most of a run. Each one, when it passes, records the tree it
  # tested (an artifact tested-<job>-<tree>); a later run of the same tree within 7 days skips
  # the job, so a squash merge into dev or a promotion to testing does not repeat what the pull
  # request already ran (tools/ci/tested-tree.py says which markers count). Lint and unit always
  # run; pushes to main (release, badges) and manual runs always run everything. A failed lookup
  # runs the jobs.
  tested:
    name: Earlier runs of this tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      package_run: ${{ steps.find.outputs.package_run }}
      bench_run: ${{ steps.find.outputs.bench_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for runs that passed on this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; }; then
            echo "Full run ($GITHUB_EVENT_NAME on $GITHUB_REF_NAME)"
            exit 0
          fi
          for job in package bench; do
            if run=$(tools/ci/tested-tree.py "$job" "$tree"); then
              if [ -n "$run" ]; then
                echo "${job}_run=$run" >> "$GITHUB_OUTPUT"
                msg="The $job job passed on this tree ($tree) in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, so it is skipped here."
                echo "::notice title=$job skipped::$msg"
                echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "No earlier run passed the $job job on $tree"
              fi
            else
              echo "::warning title=$job lookup failed::Running the $job job."
            fi
          done

  package:
    name: FreeRADIUS package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: tested
    if: >-
      !cancelled() && needs.tested.outputs.package_run == '' && (
      github.event_name != 'push' ||
      github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'testing' ||
      startsWith(github.ref_name, 'ci/'))
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
      - name: Build radius-admin-freeradius
        run: |
          # deb-src: the package builds rlm_ldap's OpenLDAP from the distribution source package
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential pkg-config dpkg-dev \
              binutils libtalloc-dev libssl-dev libpq-dev curl gnupg ca-certificates file python3-apt
          sudo tools/ci/distro-libpq.sh
          sudo tools/package/build-freeradius-deb.sh "$GITHUB_WORKSPACE/packages" /var/tmp/ra-frpkg
      - name: Package tests (install, start, upgrade, purge)
        run: |
          mkdir -p "$LOGS"
          sudo bash tests/package/test_freeradius_deb.sh --install | tee "$LOGS/package.log"
      - name: Count tests
        id: counts
        if: always()
        run: tools/ci/test-counts.py "$LOGS/package.log" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: radius-admin-freeradius
          path: packages/
          retention-days: 14
      - name: Marker for this tree
        if: needs.tested.outputs.tree != ''
        run: echo "package passed on $GITHUB_SHA in run $GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-package"
      - uses: actions/upload-artifact@v7
        if: needs.tested.outputs.tree != ''
        continue-on-error: true
        with:
          name: tested-package-${{ needs.tested.outputs.tree }}
          path: ${{ runner.temp }}/tested-package
          retention-days: 7
          overwrite: true

  bench:
    name: App tests, FreeRADIUS bench and migration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: tested
    if: >-
      !cancelled() && needs.tested.outputs.bench_run == '' && (
      github.event_name != 'push' ||
      github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'testing' ||
      startsWith(github.ref_name, 'ci/'))
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      bench_passed: ${{ steps.counts.outputs.bench_passed }}
      bench_failed: ${{ steps.counts.outputs.bench_failed }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare sandbox
        run: |
          sudo mkdir -p "$REPO" && sudo cp -a "$GITHUB_WORKSPACE/." "$REPO/"
          sudo "$REPO/tools/ci/setup.sh" "$REPO"
      - name: Build FreeRADIUS 3.2.10 and eapol_test
        run: sudo "$REPO/tools/ci/build-freeradius.sh" /opt/fr-3.2.10 /opt/ci-src
      - name: App tests
        run: |
          mkdir -p "$LOGS"
          cd "$REPO/app"
          sudo runuser -u postgres -- env PYTHONDONTWRITEBYTECODE=1 RADIUS_ADMIN_TEST_FR_PREFIX=/opt/fr-3.2.10 \
              python3 -m pytest -q -p no:cacheprovider | tee "$LOGS/app.log"
      - name: FreeRADIUS bench
        run: |
          cd "$REPO"
          sudo -E python3 tests/freeradius/run-tests.py --prefix /opt/fr-3.2.10 --bench /var/tmp/ra-bench \
              --eapol-test /opt/ci-src/eapol_test | tee "$LOGS/bench.log"
      - name: New-server install (FreeRADIUS from scratch)
        run: |
          cd "$REPO"
          sudo bash tests/installer/test_blank_server.sh /opt/fr-3.2.10 /opt/ci-src/eapol_test | tee "$LOGS/blank-server.log"
      - name: Migration test
        run: |
          cd "$REPO"
          sudo bash tests/migration/test_migrate.sh \
              /opt/ci-src/freeradius-server-3.2.10/raddb/mods-config/sql/main/sqlite/schema.sql /var/tmp/ra-mig \
              | tee "$LOGS/migration.log"
      - name: Count tests
        id: counts
        if: always()
        run: |
          tools/ci/test-counts.py "$LOGS/app.log" "$LOGS/bench.log" "$LOGS/blank-server.log" "$LOGS/migration.log" | tee -a "$GITHUB_OUTPUT"
          tools/ci/test-counts.py "$LOGS/bench.log" | sed 's/^/bench_/' | tee -a "$GITHUB_OUTPUT"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo sh -c 'cp /var/tmp/ra-bench/*.log /opt/ci-src/*.log /var/log/postgresql/*.log "$0" 2>/dev/null; chmod -R a+r "$0"' "$RUNNER_TEMP/logs" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bench-logs
          path: ${{ runner.temp }}/logs
          retention-days: 7
      - name: Marker for this tree
        if: needs.tested.outputs.tree != ''
        run: echo "bench passed on $GITHUB_SHA in run $GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-bench"
      - uses: actions/upload-artifact@v7
        if: needs.tested.outputs.tree != ''
        continue-on-error: true
        with:
          name: tested-bench-${{ needs.tested.outputs.tree }}
          path: ${{ runner.temp }}/tested-bench
          retention-days: 7
          overwrite: true

  # README badges: on every push to main, write the test counts as shields.io endpoint
  # files to the "badges" branch (one commit, replaced each time; not protected).
  badges:
    name: Update README badges
    needs: [unit, package, bench]
    if: always() && github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Write badge data
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: tools/ci/badges.py "$RUNNER_TEMP/badges"
      - name: Publish to the badges branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Badge data for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
